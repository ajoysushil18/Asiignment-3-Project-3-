<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-container">
        <div class="header">
            <h1> Task Tracker</h1>
            <p>Organize your daily tasks efficiently</p>
        </div>

        <div class="input-section">
            <input type="text" id="task-input" placeholder="Start writing and press enter to create task">
            <button id="add-btn" title="Add Task">Enter</button>
        </div>

        <!-- Task List -->
        <ul id="task-list" class="task-list">
            <!-- Tasks will be dynamically rendered here -->
        </ul>

        <div id="empty-state" class="empty-state">
            No tasks yet. Add one above to get started!
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
